name: Publish verified Standard release gate fixes

on:
  push:
    branches:
      - fix/standard-release-gates-20260828

permissions:
  contents: write

concurrency:
  group: publish-standard-release-gates
  cancel-in-progress: false

jobs:
  publish:
    name: Publish clean source commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout working branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Apply previously verified source fixes
        run: python3 scripts/apply-release-gate-fixes.py

      - name: Install formatter and normalize changed files
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            apps/api/package.json \
            apps/api/src/auth/password-benchmark.spec.ts \
            apps/api/src/health/graceful-shutdown.coordinator.spec.ts \
            packages/create-cornerstone/src/composition/composer.ts \
            packages/create-cornerstone/src/generator.ts \
            packages/create-cornerstone/src/mutation/update-engine.ts \
            scripts/test-scope.mjs \
            scripts/validate-package-boundaries.mjs
          git diff --check

      - name: Publish one clean source commit
        env:
          BASE_SHA: 2b3e277f442c7d6a991c227b33ac380ea2faa34a
          OUTPUT_BRANCH: fix/standard-release-gates
        run: |
          set -Eeuo pipefail
          git config user.name "orot"
          git config user.email "orot1195@gmail.com"
          git checkout "$BASE_SHA" -- .github/workflows/mirror-to-gitea.yml
          rm -f scripts/apply-release-gate-fixes.py
          git add -A
          git reset --soft "$BASE_SHA"
          git add -A
          git commit -m "fix: Standard release gate 안정화"
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH"
