name: Apply Standard release gate fixes

on:
  push:
    branches:
      - fix/standard-release-gates-20260828

permissions:
  contents: write

concurrency:
  group: apply-standard-release-gates
  cancel-in-progress: false

jobs:
  apply:
    name: Patch, verify and squash
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout working branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Apply release gate fixes
        run: python3 scripts/apply-release-gate-fixes.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            .github/workflows/mirror-to-gitea.yml \
            apps/api/package.json \
            apps/api/src/auth/password-benchmark.spec.ts \
            apps/api/src/health/graceful-shutdown.coordinator.spec.ts \
            packages/create-cornerstone/src/composition/composer.ts \
            packages/create-cornerstone/src/generator.ts \
            packages/create-cornerstone/src/mutation/update-engine.ts \
            scripts/test-scope.mjs

      - name: Verify formatting and types
        run: |
          pnpm format:check
          pnpm typecheck

      - name: Run API unit tests
        run: pnpm --filter api exec node --experimental-vm-modules node_modules/jest/bin/jest.js --runInBand

      - name: Run generator unit and candidate tests
        run: |
          pnpm --filter create-cornerstone test:unit
          pnpm generator:standard:candidate

      - name: Verify password benchmark harness
        run: pnpm --filter api benchmark:password:fast

      - name: Create one atomic source commit
        env:
          BASE_SHA: 7daad2454f7a5d8b58a72bf9a1aae22852c9b7f5
          EXPECTED_REMOTE_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          git diff --check
          git status --short
          git config user.name "orot"
          git config user.email "orot1195@gmail.com"
          git checkout "$BASE_SHA" -- .github/workflows/mirror-to-gitea.yml
          rm -f scripts/apply-release-gate-fixes.py
          git add -A
          git reset --soft "$BASE_SHA"
          git add -A
          git commit -m "fix: Standard release gate 안정화"
          git push \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_REMOTE_SHA" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
