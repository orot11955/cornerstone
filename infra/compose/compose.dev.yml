name: cornerstone-dev-db

services:
  postgres:
    image: postgres:16.14
    environment:
      POSTGRES_DB: cornerstone_dev
      POSTGRES_USER: cornerstone_dev_owner
      POSTGRES_PASSWORD: cornerstone-dev-owner
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - cornerstone-dev-postgres:/var/lib/postgresql/data
      - ./init/dev.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cornerstone_dev_owner -d cornerstone_dev']
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  cornerstone-dev-postgres:
